services:
  - type: web
    name: paigen-ai-cloud
    runtime: python
    plan: free
    rootDir: vercel_cloud
    buildCommand: pip install -r requirements.txt
    startCommand: python api/index.py
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: PAIGEN_CLOUD_TOKEN
        generateValue: true
      - key: PAIGEN_RUNTIME
        value: render
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
